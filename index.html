<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BDFL Offline Collector</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    
    <style>
        .hidden-section { display: none !important; }
        /* Prevents the 'pull-to-refresh' bounce effect on mobile browsers */
        body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#F4F7F9] min-h-screen flex items-center justify-center p-4 antialiased selection:bg-[#D4AF37] selection:text-[#0A2540]">
    
    <div id="login-section" class="w-full max-w-sm mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] border-t-4 border-[#0A2540]">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-[#0A2540] text-[#D4AF37] rounded-xl flex items-center justify-center text-xl font-bold mx-auto mb-3 shadow-md">B</div>
            <h1 class="text-2xl font-bold text-[#0A2540] tracking-tight">BDFL Finance</h1>
            <p class="text-sm text-gray-500 font-medium mt-1">Agent Portal</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Email</label>
                <input type="email" id="email" placeholder="agent@bdfl.com" class="w-full border border-gray-200 bg-gray-50 p-3.5 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all text-sm">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full border border-gray-200 bg-gray-50 p-3.5 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#D4AF37] focus:border-transparent transition-all text-sm">
            </div>
        </div>
        
        <button onclick="loginUser()" class="w-full bg-[#0A2540] text-[#D4AF37] font-bold py-3.5 rounded-xl mt-8 shadow-md hover:shadow-lg active:scale-[0.98] transition-all">
            Secure Login
        </button>
        <p id="login-error" class="mt-4 text-sm font-semibold text-red-500 text-center min-h-[20px]"></p>
    </div>

    <div id="dashboard-section" class="hidden-section w-full max-w-sm mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] border-t-4 border-[#D4AF37]">
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-gray-100">
            <div>
                <h2 class="text-lg font-bold text-[#0A2540] leading-tight">Log Payment</h2>
                <p class="text-xs text-gray-500 font-medium">Offline Ready</p>
            </div>
            <button onclick="logoutUser()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-100 active:scale-95 transition-all">Logout</button>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Loan Account ID</label>
                <input type="text" id="loanId" placeholder="e.g. L-1234" class="w-full border border-gray-200 bg-gray-50 p-3.5 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0A2540] focus:border-transparent transition-all text-sm uppercase">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Collection Amount</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-medium">₹</span>
                    <input type="number" id="amount" placeholder="0.00" class="w-full border border-gray-200 bg-gray-50 p-3.5 pl-8 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0A2540] focus:border-transparent transition-all text-sm">
                </div>
            </div>
        </div>
        
        <button onclick="logPayment()" class="w-full bg-[#D4AF37] text-[#0A2540] font-bold py-3.5 rounded-xl mt-8 shadow-md hover:shadow-lg active:scale-[0.98] transition-all">
            Record Collection
        </button>

        <div class="mt-6 bg-gray-50 rounded-lg p-3 text-center">
            <p id="status" class="text-xs font-semibold text-gray-500">System Ready</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
